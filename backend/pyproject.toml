[project]
name = "jobfly-backend"
version = "0.1.0"
description = "求職簡歷自動投遞系統後端（JobFly）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "cryptography>=43.0",
    "PyJWT>=2.9",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
    "apscheduler>=3.10",
    "pypdf>=5.0",
    "openai>=1.40",
    "supabase>=2.6",
    "boto3>=1.35",
]

[project.optional-dependencies]
# 瀏覽器自動化（P3/P4 需要）與 OCR 兜底（體積大，按需安裝）
automation = ["playwright>=1.47"]
ocr = ["paddleocr>=2.8", "paddlepaddle>=2.6"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
