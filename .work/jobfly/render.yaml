# Render Blueprint（備用方案：連接 GitHub 倉庫後一鍵部署）
# 注意：此文件不含真實密鑰（密鑰通過 Render API/控制台注入），可安全提交。
services:
  - type: web
    name: jobfly-backend
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: KEK_BASE64
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: jobfly
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        value: chinasnhmxy@hotmail.com
      - key: APP_ENV
        value: prod
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /ms-playwright

  - type: web
    name: jobfly-frontend
    runtime: static
    plan: free
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
