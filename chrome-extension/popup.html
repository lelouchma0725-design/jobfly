<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 340px; font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 12px; }
    h2 { margin: 0 0 8px; font-size: 15px; }
    input { width: 100%; box-sizing: border-box; margin: 4px 0; padding: 6px; }
    button { width: 100%; margin: 6px 0; padding: 8px; cursor: pointer; }
    .primary { background: #1d4ed8; color: #fff; border: none; border-radius: 6px; }
    .ghost { background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; }
    .task { border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px; margin: 6px 0; }
    .task b { display: block; }
    .muted { color: #6b7280; font-size: 12px; }
    .ok { color: #15803d; }
    .err { color: #dc2626; }
    #status { min-height: 16px; }
  </style>
</head>
<body>
  <h2>JobsComing RPA 填報助手</h2>
  <div id="loginBox">
    <input id="email" type="email" placeholder="JobsComing 郵箱" />
    <input id="password" type="password" placeholder="密碼" />
    <button id="signin" class="primary">登錄</button>
  </div>
  <div id="taskBox" style="display: none">
    <h3 style="font-size:13px;margin:10px 0 4px">📄 簡歷維護助手（中信等需先維護簡歷的站點）</h3>
    <p class="muted">
      流程：官網「我的申請」打開某份簡歷頁 → ①回傳此頁簡歷資料（存元信息）→ 打開另一份簡歷頁 →
      ②用元信息填報此頁 → ③校驗兩份簡歷一致性。
    </p>
    <select id="pageType" style="width:100%;padding:6px;margin:4px 0">
      <option value="校園招聘簡歷">校園招聘簡歷</option>
      <option value="社會招聘簡歷">社會招聘簡歷</option>
      <option value="分支校園招聘簡歷">分支校園招聘簡歷</option>
      <option value="分支社會招聘簡歷">分支社會招聘簡歷</option>
    </select>
    <select id="compareWith" style="width:100%;padding:6px;margin:4px 0">
      <option value="">校驗對象：自動（最近一份其他簡歷）</option>
      <option value="校園招聘簡歷">校園招聘簡歷</option>
      <option value="社會招聘簡歷">社會招聘簡歷</option>
      <option value="分支校園招聘簡歷">分支校園招聘簡歷</option>
      <option value="分支社會招聘簡歷">分支社會招聘簡歷</option>
    </select>
    <button id="scrape" class="ghost">① 回傳此頁簡歷資料</button>
    <button id="fillResume" class="ghost">② 用元信息填報此頁</button>
    <button id="verify" class="ghost">③ 校驗簡歷一致性</button>
    <h3 style="font-size:13px;margin:10px 0 4px">🎯 投遞任務</h3>
    <div id="tasks"></div>
    <button id="refresh" class="ghost">刷新任務</button>
    <div id="status"></div>
    <p class="muted">
      申請頁填報用法：先在官網登錄並打開崗位申請頁 → 面板點對應任務的「開始填報」→
      表單自動填充並高亮，你只需檢查並點「提交」。
    </p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
